name: Production Flap Probe

on:
  push:
    branches: [diagnostics/public-health-mirror]
    paths:
      - 'diagnostics/run-flap-probe.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diagnostics/public-health-mirror
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Probe production for three minutes
        run: node diagnostics/probe-production.mjs

      - name: Commit diagnostic timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetry/flap-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: record production flap timeline"
          git push origin HEAD:diagnostics/public-health-mirror
