name: Fleet Public Probe

on:
  push:
    branches: [diagnostics/public-health-mirror]
    paths:
      - 'diagnostics/run-fleet-probe.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: diagnostics/public-health-mirror
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Probe all known public apps
        run: node diagnostics/probe-fleet.mjs

      - name: Commit fleet probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetry/fleet-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: record public fleet probe"
          git pull --rebase origin diagnostics/public-health-mirror
          git push origin HEAD:diagnostics/public-health-mirror
