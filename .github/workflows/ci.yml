name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Check server syntax
        run: |
          node --check server/index.js
          node --check server/controlPlaneV2.js
          node --check server/productionSelfTest.js

      - name: Run server unit tests
        run: node --test server/controlPlaneV2.test.js

      - name: Check installer and helper syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-hermes-control.sh
          python3 -m py_compile scripts/hermes-control-maintenance.py scripts/hermes-backup-drill.py
