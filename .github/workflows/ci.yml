name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Check server syntax
        run: node --check server/index.js

      - name: Check installer shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-hermes-control.sh
